
name: kanatake-board

# 手動実行のみ。
# check: 環境・認証確認
# preview: 画像を生成してArtifactsに保存。公開しない
# generate: 画像を生成してWorkerに登録
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check=認証確認 / preview=非公開生成 / generate=Worker登録"
        required: true
        type: choice
        options:
          - check
          - preview
          - generate
        default: check

permissions:
  contents: read

concurrency:
  group: kanatake-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install fonts and dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

          python -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            "Pillow==13.0.0" \
            "requests==2.34.2"

          python -m pip check

      - name: Verify environment and files
        shell: bash
        run: |
          set -euo pipefail

          test -f board/watcher.py
          test -f board/adapter.py
          test -f board/make_board.py
          test -f board/crops.json
          test -f board/id_mapping.json

          FONT=/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc
          test -f "$FONT"
          sha256sum "$FONT"

          python - <<'PY'
          import ast
          import json
          import platform
          from pathlib import Path
          import PIL
          import requests

          base = Path("board")

          for name in (
              "watcher.py",
              "adapter.py",
              "make_board.py",
          ):
              ast.parse(
                  (base / name).read_text(encoding="utf-8")
              )

          for name in (
              "crops.json",
              "id_mapping.json",
          ):
              json.loads(
                  (base / name).read_text(encoding="utf-8")
              )

          print("Python:", platform.python_version())
          print("Pillow:", PIL.__version__)
          print("requests:", requests.__version__)
          print("Source verification: OK")
          PY

      # check: Workerへの読み取り専用認証テスト
      - name: Verify Worker authentication
        if: ${{ inputs.mode == 'check' }}
        shell: bash
        env:
          KANATAKE_SALES_API_BASE: ${{ vars.KANATAKE_SALES_API_BASE }}
          KANATAKE_MUSE_TOKEN: ${{ secrets.KANATAKE_MUSE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$KANATAKE_SALES_API_BASE" ]; then
            echo "::error::KANATAKE_SALES_API_BASE is missing"
            exit 1
          fi

          if [ -z "$KANATAKE_MUSE_TOKEN" ]; then
            echo "::error::KANATAKE_MUSE_TOKEN is missing"
            exit 1
          fi

          code="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 20 \
            --header "Authorization: Bearer $KANATAKE_MUSE_TOKEN" \
            "${KANATAKE_SALES_API_BASE%/}/muse/today")"

          if [ "$code" != "200" ]; then
            echo "::error::Worker authentication failed (HTTP $code)"
            exit 1
          fi

          echo "Worker authentication OK (HTTP 200)"

      # preview: データ取得と画像生成のみ
      # PUT /muse/board は呼び出さない
      - name: Generate preview image (no publishing)
        if: ${{ inputs.mode == 'preview' }}
        working-directory: board
        shell: bash
        env:
          KANATAKE_SALES_API_BASE: ${{ vars.KANATAKE_SALES_API_BASE }}
          KANATAKE_MUSE_TOKEN: ${{ secrets.KANATAKE_MUSE_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$KANATAKE_SALES_API_BASE"
          test -n "$KANATAKE_MUSE_TOKEN"

          python - <<'PY'
          import os
          from PIL import Image
          from watcher import SalesClient
          import adapter

          client = SalesClient(
              os.environ["KANATAKE_SALES_API_BASE"],
              os.environ["KANATAKE_MUSE_TOKEN"]
          )

          today = client.get_today()
          items = today.get("items", [])

          print("Day:", today.get("day"))
          print("Phase:", today.get("phase"))
          print("Version:", today.get("version"))
          print("Items:", len(items))

          if not isinstance(items, list) or not 1 <= len(items) <= 16:
              raise SystemExit(
                  "Preview requires 1 to 16 selected products"
              )

          # 画像生成のみ。WorkerへPUTしない。
          result = adapter.generate(
              today,
              "board-preview.jpg"
          )

          with Image.open("board-preview.jpg") as im:
              if im.format != "JPEG":
                  raise SystemExit("Preview is not JPEG")
              if im.size != (1080, 1920):
                  raise SystemExit("Invalid preview dimensions")
              im.verify()

          size = os.path.getsize("board-preview.jpg")

          if size > 5 * 1024 * 1024:
              raise SystemExit("Preview exceeds 5 MiB")

          print("Preview generated successfully")
          print("Image size:", size, "bytes")
          print("Product count:", result["count"])
          print("Photo sources:")
          for source in result["sources"]:
              print(
                  source["product_id"],
                  source["photo"]
              )
          print("No Worker PUT was performed")
          PY

      # GitHub内に生成画像を一時保存
      - name: Upload preview artifact
        if: ${{ inputs.mode == 'preview' }}
        uses: actions/upload-artifact@v4
        with:
          name: kanatake-board-preview
          path: board/board-preview.jpg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # generate: 実際のWorker登録
      # previewと異なりR2の公開画像を変更する可能性がある
      - name: Generate board if needed
        if: ${{ inputs.mode == 'generate' }}
        working-directory: board
        shell: bash
        env:
          KANATAKE_SALES_API_BASE: ${{ vars.KANATAKE_SALES_API_BASE }}
          KANATAKE_MUSE_TOKEN: ${{ secrets.KANATAKE_MUSE_TOKEN }}
        run: |
          set -euo pipefail

          test -n "$KANATAKE_SALES_API_BASE"
          test -n "$KANATAKE_MUSE_TOKEN"

          python watcher.py --once
